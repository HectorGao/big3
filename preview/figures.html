<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动作示意图册</title><style>body{font:14px sans-serif;margin:24px;background:#fafbf9;color:#263a30}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}canvas{width:100%;aspect-ratio:640/260}h2{font-size:14px}p{font-size:12px;color:#71836e}section{border-bottom:1px solid #dfe6da;padding-bottom:12px}@media(max-width:700px){main{grid-template-columns:1fr}}</style></head><body><h1>动作示意图册</h1><p>每个动作的起始与结束姿势；示意不能替代现场技术指导。</p><main></main><script src="../miniprogram/lib/catalog.js"></script><script src="../miniprogram/lib/exercise-figures.js"></script><script>for(const ex of MuscleCatalog.exercises){const section=document.createElement('section');section.innerHTML='<h2>'+ex.name+'</h2><canvas aria-label="'+ex.name+'"></canvas><p>'+MuscleFigures.figures[ex.id].cue+'</p>';document.querySelector('main').append(section);const c=section.querySelector('canvas');c.width=640;c.height=260;MuscleFigures.draw(c.getContext('2d'),640,260,ex.id);}</script></body></html>
